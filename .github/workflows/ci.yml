name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Backend (Rails)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ecom
          POSTGRES_PASSWORD: ecom
          POSTGRES_DB: ecom_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ecom"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      RAILS_ENV: test
      DATABASE_URL: postgres://ecom:ecom@localhost:5432/ecom_test
      REDIS_URL: redis://localhost:6379/0
      FRONTEND_ORIGIN: http://localhost:3000
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4.2"
          bundler-cache: true
      - name: Lint (RuboCop)
        run: bundle exec rubocop
      - name: Security scan (Brakeman)
        run: bundle exec brakeman -q --no-pager
      - name: Dependency audit
        run: bundle exec bundler-audit check --update
      - name: Prepare database
        run: bin/rails db:prepare
      - name: Tests (RSpec)
        run: bundle exec rspec
